apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kargo-demo
  labels:
    app: kargo-demo
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: kargo-demo
  endpoints:
  - port: http
    path: /metrics
    interval: 5s
  namespaceSelector:
    any: true
